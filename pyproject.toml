[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "confdrift"
version = "0.2.0"
description = "Semantic diff for Cisco IOS configs that tells you which changes are risky"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chimnadindu Chibueze"}]

[project.scripts]
confdrift = "confdrift.cli:main"

[tool.setuptools]
packages = ["confdrift"]
